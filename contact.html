  <main id="main">
    <h1>Contact</h1>
    <p class="lead">I love chatting about new ideas and opportunities. Drop me a line here:</p>

    <div class="contact-grid">
      <form class="contact-form" id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>

        <label for="email">Your email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="7" required></textarea>

        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">

        <button class="button" type="submit">Send message</button>
        <p class="form-note" id="form-note" role="status">I'll get your message by email and reply as soon as I can.</p>
      </form>

      <aside class="contact-side" aria-label="Email address">
        <h2>Email</h2>
        <p id="email-display">kravi (at) chicagobooth (dot) edu</p>
      </aside>
    </div>
  </main>
